<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hair Cutting Effect (Responsive SVG Mask)</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        background-color: #fce8d8; /* Color simulando piel de fondo */
      }

      .hair-section {
        width: 100%;
        height: 100vh;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none; /* Previene seleccion de texto accidental */
      }

      .bg-content {
        text-align: center;
        color: #d88147;
        pointer-events: none; /* Ignora clicks para que pasen al SVG */
      }

      .bg-content h1 {
        font-size: 4rem;
        margin: 0;
      }
      .bg-content p {
        font-size: 1.5rem;
        margin-top: 10px;
      }

      .hair-texture-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <section class="hair-section">
      <!-- Contenido que se revela (simula la piel limpia o mensaje oculto) -->
      <div class="bg-content">
        <h1>¡Corte Perfecto!</h1>
        <p>Descubre lo que hay debajo...</p>
      </div>

      <!-- SVG que cubre toda la sección y contiene la textura de pelo -->
      <svg class="hair-texture-svg" id="hairSvg" preserveAspectRatio="none">
        <defs>
          <!-- Definición de la textura de pelo usando un patrón SVG.
                     Aquí se puede reemplazar con una <image> externa de la textura original -->
          <pattern
            id="hairPattern"
            patternUnits="userSpaceOnUse"
            width="100"
            height="100"
          >
            <!-- Fondo base oscuro -->
            <rect width="100" height="100" fill="#2c2c2c" />
            <!-- Líneas simulando pelos -->
            <path
              d="M10,0 Q15,50 10,100 M30,0 Q35,50 25,100 M50,0 Q55,50 50,100 M70,0 Q65,50 75,100 M90,0 Q95,50 85,100"
              stroke="#111"
              stroke-width="2"
              fill="none"
            />
            <path
              d="M5,0 Q10,50 0,100 M25,0 Q30,50 20,100 M45,0 Q50,50 40,100 M65,0 Q60,50 70,100 M85,0 Q90,50 80,100"
              stroke="#3a3a3a"
              stroke-width="1.5"
              fill="none"
            />
          </pattern>

          <!-- Máscara que recortará el patrón donde interactúe el usuario -->
          <mask id="cutMask">
            <!-- Por defecto todo es blanco (100% visible) -->
            <rect width="100%" height="100%" fill="white" />
            <!-- El trazo de la navaja será dibujado en negro para hacer transparente esa zona -->
            <path
              id="cutPath"
              fill="none"
              stroke="black"
              stroke-width="80"
              stroke-linecap="round"
              stroke-linejoin="round"
              d=""
            />
          </mask>
        </defs>

        <!-- Elemento que renderiza el patrón de pelo con la máscara aplicada -->
        <rect
          width="100%"
          height="100%"
          fill="url(#hairPattern)"
          mask="url(#cutMask)"
        />
      </svg>
    </section>

    <script>
      const svg = document.getElementById("hairSvg");
      const cutPath = document.getElementById("cutPath");
      let isDrawing = false;
      let pathData = "";

      // Calcula coordenadas relativas al SVG
      function getCoordinates(e) {
        const rect = svg.getBoundingClientRect();
        // Soporte para touch y mouse
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        // Convertimos las coordenadas en base al ancho/alto real vs el renderizado
        let x = clientX - rect.left;
        let y = clientY - rect.top;
        return { x, y };
      }

      // Inicia el corte (mousedown o touchstart)
      function startCutting(e) {
        isDrawing = true;
        const { x, y } = getCoordinates(e);
        // Iniciamos un nuevo subtrazo
        pathData += `M ${x} ${y} `;
        cutPath.setAttribute("d", pathData);

        // Prevenir scroll en móviles al tocar
        if (e.type === "touchstart") e.preventDefault();
      }

      // Movimiento de la navaja (mousemove o touchmove)
      function cut(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        // Continuamos la línea
        pathData += `L ${x} ${y} `;
        cutPath.setAttribute("d", pathData);
      }

      // Detiene el corte
      function stopCutting() {
        isDrawing = false;
      }

      // Eventos Mouse
      svg.addEventListener("mousedown", startCutting);
      svg.addEventListener("mousemove", cut);
      svg.addEventListener("mouseup", stopCutting);
      svg.addEventListener("mouseleave", stopCutting);

      // Eventos Touch (Responsividad y Mobile)
      svg.addEventListener("touchstart", startCutting, { passive: false });
      svg.addEventListener("touchmove", cut, { passive: false });
      svg.addEventListener("touchend", stopCutting);
      svg.addEventListener("touchcancel", stopCutting);
    </script>
  </body>
</html>
